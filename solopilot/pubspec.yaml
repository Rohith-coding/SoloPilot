name: solopilot
description: A private, on-device AI back-office for freelancers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.0
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_entity_extraction: ^0.13.0
  google_mlkit_smart_reply: ^0.10.0
  sqflite: ^2.4.0
  path: ^1.9.0
  provider: ^6.1.0
  pdf: ^3.11.0
  printing: ^5.13.0
  speech_to_text: ^7.0.0
  flutter_local_notifications: ^18.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
